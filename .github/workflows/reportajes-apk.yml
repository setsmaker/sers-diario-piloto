name: SERS Photo · APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android-reportajes/**'
      - 'reportajes/**'
      - 'zip.js'
      - 'icons/**'
      - '.github/workflows/reportajes-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar herramientas Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Empaquetar web de Reportajes dentro de la APK
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="android-reportajes/app/src/main/assets/web"
          mkdir -p "$ASSETS/reportajes" "$ASSETS/icons" android-reportajes/app/src/main/res/drawable-nodpi
          cp reportajes/index.html reportajes/styles.css reportajes/leaflet.css reportajes/db.js reportajes/app.js \
            reportajes/cloud.js reportajes/import.js reportajes/sw.js reportajes/manifest.webmanifest "$ASSETS/reportajes/"
          # Cargar Leaflet desde el propio APK: evita fallos de CDN y funciona
          # incluso sin conexión, aunque los mapas raster sí requieren Internet.
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 \
            'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js' \
            -o "$ASSETS/reportajes/leaflet.js" || \
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 \
            'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' \
            -o "$ASSETS/reportajes/leaflet.js"
          ACTUAL="$(openssl dgst -sha256 -binary "$ASSETS/reportajes/leaflet.js" | base64 -w0)"
          test "$ACTUAL" = '20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo='
          python3 - <<'PY'
          from pathlib import Path
          file=Path('android-reportajes/app/src/main/assets/web/reportajes/index.html')
          html=file.read_text()
          old='<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>'
          assert old in html
          # Inyectamos la biblioteca dentro del HTML de la APK.
          # Así no puede ser interceptada por un SW antiguo de la versión web.
          leaflet=Path('android-reportajes/app/src/main/assets/web/reportajes/leaflet.js').read_text()
          assert '</script' not in leaflet.lower()
          file.write_text(html.replace(old,'<script>'+leaflet+'</script>'))
          PY
          cp zip.js "$ASSETS/zip.js"
          cp icons/icon-192.png icons/icon-512.png "$ASSETS/icons/"
          cp icons/icon-192.png android-reportajes/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Compilar APK
        run: gradle -p android-reportajes --no-daemon assembleDebug
      - name: Preparar APK con nombre de instalación
        run: |
          mkdir -p dist
          cp android-reportajes/app/build/outputs/apk/debug/app-debug.apk dist/SERS_Photo_v6.apk
          test -s dist/SERS_Photo_v6.apk
      - name: Adjuntar APK a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SERS-Reportajes-APK
          path: dist/SERS_Photo_v6.apk
      - name: Publicar APK de prueba en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="sers-photo-v6"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SERS_Photo_v6.apk --clobber
          else
            gh release create "$TAG" dist/SERS_Photo_v6.apk \
              --title "SERS Reportajes · APK de prueba v6" \
              --notes "SERS Photo v6: selección y borrado de reportajes, galería mejorada, mapa con fotos agrupadas y OneDrive mediante compartir Android. Captura, GPS, brújula, dictado, galería, mapa y exportación ZIP. APK de prueba; se recomienda no usar con información confidencial hasta validar seguridad y sincronización."
          fi
